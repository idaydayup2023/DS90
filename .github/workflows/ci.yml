name: rust-ci

# version4. T1 is scripts/agent-check.sh --workspace (fmt, clippy, locked workspace tests).
# Ignored live tests stay out of this workflow. v3.* tag releases stay on release.yml.
on:
  push:
    branches: [version4]
  pull_request:
    branches: [version4]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1d1eb14921d9c2d8ea575663e5fe3a0b57868a05 # 1.89.0
        with:
          components: rustfmt, clippy
      - name: T1 agent check
        run: scripts/agent-check.sh --workspace
      - run: cargo build --locked --release

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1d1eb14921d9c2d8ea575663e5fe3a0b57868a05 # 1.89.0
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit --deny warnings
