name: rust-ci

on:
  push:
    branches: [version3]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1d1eb14921d9c2d8ea575663e5fe3a0b57868a05 # 1.89.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1d1eb14921d9c2d8ea575663e5fe3a0b57868a05 # 1.89.0
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit --deny warnings

  # 闸具负控（站长 2026-11-28 03:1x ② 令：「只验不写」必须实测零写）
  # 写型闸具／词表的回归必须在合并前跑，红即不得合；用 runner 自带 python3，不引新 action。
  gate-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: manifest 换绑具负控（T1–T6：零写实测＋等长不假红＋同案锁＋D2 结构锁）
        run: python3 tools/test_manifest_sidecar_rebind_20261128.py
      - name: A5 专名废形表阳性对照自测（44 阳性全咬／2 负例放过，fail-closed）
        run: python3 tools/a5_positive_control_selftest_20261127.py
