name: rust-release

on:
  push:
    tags: ["v3.*"]

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1d1eb14921d9c2d8ea575663e5fe3a0b57868a05 # 1.89.0
      - run: rustup target add aarch64-apple-darwin
      - name: Require matching changelog entry
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          if [[ "$cargo_version" != "$version" ]]; then
            echo "Cargo.toml version $cargo_version does not match release tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "CHANGELOG.md has no non-empty release section for $version" >&2
            exit 1
          fi
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release --target aarch64-apple-darwin
      - name: Package and checksum
        run: |
          cp target/aarch64-apple-darwin/release/subtrans subtrans-darwin-arm64
          shasum -a 256 subtrans-darwin-arm64 > subtrans-darwin-arm64.sha256
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "subtrans $GITHUB_REF_NAME" --notes-file release-notes.md
            gh release upload "$GITHUB_REF_NAME" --clobber subtrans-darwin-arm64 subtrans-darwin-arm64.sha256
          else
            gh release create "$GITHUB_REF_NAME" --title "subtrans $GITHUB_REF_NAME" --notes-file release-notes.md subtrans-darwin-arm64 subtrans-darwin-arm64.sha256
          fi
