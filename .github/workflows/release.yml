name: rust-release

on:
  push:
    tags: ["v3.*"]

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1d1eb14921d9c2d8ea575663e5fe3a0b57868a05 # 1.89.0
      - run: rustup target add aarch64-apple-darwin
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release --target aarch64-apple-darwin
      - name: Package and checksum
        run: |
          cp target/aarch64-apple-darwin/release/subtrans subtrans-darwin-arm64
          shasum -a 256 subtrans-darwin-arm64 > subtrans-darwin-arm64.sha256
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber subtrans-darwin-arm64 subtrans-darwin-arm64.sha256
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes subtrans-darwin-arm64 subtrans-darwin-arm64.sha256
          fi
