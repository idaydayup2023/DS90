[package]
name = "subtrans"
version = "3.1.0"
edition = "2024"
rust-version = "1.89"
description = "Auditable subtitle translation and media migration"
license = "MIT"

[[bin]]
name = "subtrans"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6.5", features = ["derive"] }
hex = "0.4"
fs2 = "0.4"
libc = "0.2"
regex = "1.12"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
suppaftp = "10.0.1"
tempfile = "3.23"
toml = "1.1.4"
walkdir = "2.5.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
