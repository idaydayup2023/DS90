version = 3

# 扫描级排除：命中的源相对路径在资料、字幕、迁移三处扫描中完全跳过，
# 不计入视频数、失败数或待处理数，文件保持在磁盘上原样不动。
# exclude_paths 支持精确文件路径或目录前缀（目录下的内容全部排除）。
# exclude_globs 为分节 glob：`*`/`?` 只在单个路径节内匹配，`**` 可跨节。
[scan]
exclude_paths = []
exclude_globs = []

[state]
database = "./state/subtrans.sqlite3"
lease_seconds = 7200

# 生产媒体全部通过同一 FTP 账户访问。TOML 只保存服务器、端口和
# 环境变量名；真实账号在进程启动时由 SUBTRANS_FTP_USERNAME 提供。
[source]
kind = "ftp"
host = "nas.example.internal"
port = 10021
username_env = "SUBTRANS_FTP_USERNAME"
password_env = "SUBTRANS_FTP_PASSWORD"
root = "/Downloads"
timeout_seconds = 300
allow_plaintext = true # 仅限隔离且可信的内网

[destination]
kind = "ftp"
host = "nas.example.internal"
port = 10021
username_env = "SUBTRANS_FTP_USERNAME"
password_env = "SUBTRANS_FTP_PASSWORD"
root = "/"
timeout_seconds = 300
allow_plaintext = true # 目标根下必须能看到 MOVIE、TV、X-Movie、X-TV

# 资料拉取使用 Infuse 自身默认的 TMDB 影片库。配置只保存 API Read Access
# Token 的环境变量名，真实 Token 不得写入 TOML、日志或 Git。
[metadata]
enabled = true
base_url = "https://api.themoviedb.org/3"
image_base_url = "https://image.tmdb.org/t/p/original"
api_token_env = "SUBTRANS_TMDB_READ_TOKEN"
language = "zh-CN"
fallback_language = "en-US"
timeout_seconds = 30
max_retries = 2
max_response_bytes = 4194304
max_image_bytes = 33554432
match_threshold = 0.85
ambiguity_gap = 0.08
# TMDB 条款不允许把 API 数据无限期缓存；最大只能配置为 180 天。
refresh_after_days = 180

# 自动匹配有歧义时必须按源相对路径填写精确 ID。电视剧还必须给出季集。
# [metadata.overrides."incoming/Supergirl.2026.2160p.WEB-DL.mkv"]
# kind = "movie"
# tmdb_id = 123456

# [metadata.overrides."incoming/Show.Name.S01E02.2160p.WEB-DL.mkv"]
# kind = "tv"
# tmdb_id = 654321
# season = 1
# episode = 2

[subtitles]
video_extensions = ["mkv", "mp4", "avi", "mov", "m4v", "ts"]
min_video_bytes = 1048576
ffmpeg = "ffmpeg"
ffprobe = "ffprobe"
external_process_timeout_seconds = 7200
# 终稿防误覆盖闸：发布前若现成 .ai.srt 的 manifest 缺失或不匹配，先把现件
# 归档为 <stem>.ai.srt.<team>.predel.<ts>.bak 并校验哈希，归档失败即中止发布。
# 取消注释可把归档集中到指定根目录（保留相对路径）；注释掉则归档落在终稿旁边。
# output_backup_root = "subtitle-overwrite-archives"
# 引擎发布 .ai.<ext> 终稿使用的扩展名（默认 srt）。读取侧一律并认已知形
# srt 与 ass：名册工具产的 .ai.ass 终稿+manifest 会被直接承认为 ready，
# 不必改此项；只有要让引擎直接发布 .ass 时才取消注释。
# artifact_output_extension = "srt"

[subtitles.external_srt_validation]
# 有内置英文字幕时必须与外置英文 SRT 交叉验证；没有内置英文时直接信任
# 已通过 UTF-8/SRT/语言质量门的外置英文字幕。
min_timing_match_ratio = 0.70
min_text_similarity = 0.45
external_quality_margin = 5.0

# 可选 worker；subtrans 不会自动安装或下载它们。
# [subtitles.asr]
# enabled = true
# command = "/opt/subtrans-workers/asr"
# args = ["--input", "{input}", "--output", "{output}", "--language", "{language}"]
# version_args = ["--version"]
# version = "whisper.cpp-1.7.6-model-large-v3"

# [subtitles.pgs_ocr]
# enabled = true
# command = "/opt/subtrans-workers/pgs-ocr"
# args = ["--input", "{input}", "--stream", "{stream}", "--output", "{output}", "--language", "{language}"]
# version_args = ["--version"]
# version = "pgs-ocr-2026.08"

[translation]
provider = "ollama"
base_url = "http://127.0.0.1:11434"
model = "translategemma:4b"
# 4B TranslateGemma 负责常规批量翻译；独立通用模型负责一次性最终审校。
alignment_model = "gemma4:12b-mlx"
source_language = "English"
source_language_code = "en"
target_language = "Simplified Chinese"
target_language_code = "zh-CN"
bilingual = true
# 默认顺序处理 32 条；每批只携带前 6 条只读上下文。结构校验失败时
# 立即拆小，极端情况下单条补译；仅缺少合法索引时不重译整批。
batch_size = 32
min_batch_size = 1
context_cues = 6
timeout_seconds = 300
max_retries = 2
max_batch_chars = 8000
max_response_bytes = 4194304
# 限制单次生成，避免模型输出跑偏后占满整个请求超时窗口。
max_output_tokens = 4096
min_target_script_ratio = 0.15
# 关闭独立的整片一致性往返，只保留下一段的一次性最终审校。
consistency_check = false
# 翻译完成后每次最多审 8 条；审校模型直接给出最终修正版，不回送翻译模型、
# 不对修正版再次审校。结构或编号失败时只做拆批恢复。
alignment_check = true
alignment_batch_size = 8
alignment_context_cues = 6
alignment_max_corrections = 8
# 审校模型直接给出最终中文；正式字幕不加问题标签，所有失败或存疑信息
# 只在字幕 manifest 中保留质量现场记录。
alignment_max_output_tokens = 4096

# 模型应答缓存目录（可选）。设置后每条模型应答按
# sha256(provider + base_url + model + prompt) 落盘，重跑同一批次直接回放，
# 进程中途被打断也不必把已译完的字幕重新烧一遍。命中件仍走与实收应答完全相同
# 的严格 JSON 校验：解析不过的条目不采信、即刻剔除并重新请求；未通过校验的应答
# 也绝不入缓存。缺省不设置即彻底关闭，行为与没有该功能时逐字一致（不碰磁盘、
# 不新增日志）。该开关只影响速度，不参与 cache_key 计算：启用它或换目录都不会
# 让已发布的 manifest 失配。建议写绝对路径，`~` 前缀会展开到主目录。
# cache_dir = "/data/ds90/resp-cache"

# OpenAI-compatible 示例：
# provider = "openai_compatible"
# base_url = "https://example.invalid/v1"
# api_key_env = "SUBTRANS_LLM_API_KEY"

[migration]
auto_apply_confidence = 0.95
sidecar_extensions = ["srt", "ass", "ssa", "vtt", "nfo", "json", "jpg", "png"]
# 字幕翻译和目录迁移都会跳过带有这些未完成下载标记的视频。
incomplete_marker_extensions = ["aria2", "part", "crdownload"]
require_translated_subtitle = true

# 下载根目录下用于混放散装资源的目录。在这些目录中的电影会用文件名
# 作为发布目录名，避免所有电影都落入同一个 low_imdb/incoming 目录。
generic_source_directories = ["incoming", "low_imdb"]

# 四类媒体分别配置目标根、目录模板和文件名模板。模板只支持文档列出的
# 受限字段；绝对路径、..、未知字段和未覆盖 A-Z 的字母分组会被拒绝。
[migration.layouts.movie_4k]
root = "MOVIE"
directory_template = "{year_bucket}/{release_dir}"
filename_template = "{source_file_dot}"
# 1900 以后全部按精确年份分桶。
recent_year_from = 1900

[migration.layouts.movie_other]
root = "X-Movie"
directory_template = "{year_bucket}/{release_dir}"
filename_template = "{source_file_dot}"
# 2024 及以后使用精确年份，之前使用 1990s/2000s 等年代目录。
recent_year_from = 2024

[migration.layouts.tv_4k]
root = "TV"
directory_template = "{alpha_group}/{title_dot}/S{season_padded}"
filename_template = "{source_file_dot}"

[[migration.layouts.tv_4k.alphabet_groups]]
letters = "ABC"
directory = "[A.B.C]"

[[migration.layouts.tv_4k.alphabet_groups]]
letters = "DEF"
directory = "[D.E.F]"

[[migration.layouts.tv_4k.alphabet_groups]]
letters = "GHIJK"
directory = "[G.H.I.J.K]"

[[migration.layouts.tv_4k.alphabet_groups]]
letters = "LMN"
directory = "[L.M.N]"

[[migration.layouts.tv_4k.alphabet_groups]]
letters = "OPQR"
directory = "[O.P.Q.R]"

[[migration.layouts.tv_4k.alphabet_groups]]
letters = "S"
directory = "[S]"

[[migration.layouts.tv_4k.alphabet_groups]]
letters = "T"
directory = "[T]"

[[migration.layouts.tv_4k.alphabet_groups]]
letters = "UVWXYZ"
directory = "[U.V.W.Y.Z]"

[migration.layouts.tv_other]
root = "X-TV"
directory_template = "{title_dot}/S{season_padded}"
filename_template = "{source_file_dot}"

# 可选的剧名路由只改变目标展示名/特殊分组，不改变电影或电视剧分类。
# [migration.title_routes."Lucky 2026"]
# title = "Lucky"
# group = "[L.M.N]"

# [migration.title_routes."Loki"]
# group = "[Marvels]"

# 待确认项只能通过“源相对路径完全匹配”的显式覆盖解决。修改后必须重新生成计划。
# [migration.overrides."incoming/Supergirl.2026.2160p.WEB-DL.mkv"]
# kind = "movie"
# title = "Supergirl"
# year = 2026
# is_4k = true
# allow_untranslated = false

# [migration.overrides."incoming/Show.Name.S01E02.2160p.WEB-DL.mkv"]
# kind = "tv"
# title = "Show Name"
# season = 1
# episode = 2
# is_4k = true
