# 媒体库管理系统配置文件
# Media Library Management System Configuration

# 数据库配置
database:
  # SQLite数据库文件路径（相对于项目根目录）
  path: "data/media_library.db"
  # 数据库备份目录
  backup_dir: "data/backups"
  # 自动备份间隔（小时）
  auto_backup_hours: 24

# 扫描配置
scanner:
  # 媒体文件根目录列表
  media_directories:
    - "/volume1/video/Movies"      # 电影目录
    - "/volume1/video/TV Shows"    # 电视剧目录
    - "/volume1/video/Documentaries"  # 纪录片目录
  
  # 支持的视频文件扩展名
  video_extensions:
    - ".mp4"
    - ".mkv"
    - ".avi"
    - ".mov"
    - ".wmv"
    - ".flv"
    - ".webm"
    - ".m4v"
    - ".ts"
    - ".m2ts"
  
  # 最小文件大小（MB）- 小于此大小的文件将被忽略
  min_file_size_mb: 10
  
  # 扫描时的并发线程数
  max_workers: 4
  
  # 是否跳过隐藏文件和目录
  skip_hidden: true
  
  # 排除的目录模式
  exclude_patterns:
    - ".*"           # 隐藏目录
    - "Thumbs.db"    # Windows缩略图
    - ".DS_Store"    # macOS系统文件
    - "*.tmp"        # 临时文件
    - "*.part"       # 下载中的文件
    - "@eaDir"       # 群晖系统目录
    - "#recycle"     # 群晖回收站

# TMDB API配置
tmdb:
  # TMDB API密钥（需要从 https://www.themoviedb.org/settings/api 获取）
  api_key: ""
  
  # 语言偏好（优先级从高到低）
  language_preference: "zh-CN,en-US"
  
  # API请求间隔（秒）- 避免触发速率限制
  request_interval: 0.25
  
  # 自动更新元数据
  auto_update_metadata: true
  
  # 批量更新时每次处理的数量
  batch_update_size: 50

# 重复文件检测配置
duplicate_detection:
  # 是否启用重复检测
  enabled: true
  
  # 文件名相似度阈值（0-1）
  name_similarity_threshold: 0.8
  
  # 文件大小差异阈值（百分比）
  size_difference_threshold: 0.05
  
  # 自动检测间隔（小时）
  auto_detection_hours: 168  # 一周
  
  # 重复文件处理策略
  resolution_strategy:
    # 优先保留的质量等级（从高到低）
    quality_priority:
      - "4K"
      - "2160p"
      - "1080p"
      - "720p"
      - "480p"
    
    # 优先保留的编码格式（从高到低）
    codec_priority:
      - "h265"
      - "hevc"
      - "h264"
      - "x264"
    
    # 优先保留的来源（从高到低）
    source_priority:
      - "remux"
      - "bluray"
      - "web-dl"
      - "webrip"
      - "hdtv"

# 日志配置
logging:
  # 日志级别: DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: "INFO"
  
  # 日志文件路径
  file: "logs/media_manager.log"
  
  # 日志文件最大大小（MB）
  max_file_size_mb: 10
  
  # 保留的日志文件数量
  backup_count: 5
  
  # 日志格式
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  # 是否同时输出到控制台
  console_output: true

# Web界面配置（可选）
web:
  # 是否启用Web界面
  enabled: false
  
  # 监听地址
  host: "0.0.0.0"
  
  # 监听端口
  port: 8080
  
  # 是否启用调试模式
  debug: false

# 性能配置
performance:
  # 文件哈希计算的块大小（字节）
  hash_chunk_size: 8192
  
  # 数据库连接池大小
  db_pool_size: 5
  
  # 缓存配置
  cache:
    # 是否启用缓存
    enabled: true
    
    # 缓存大小（条目数）
    max_size: 1000
    
    # 缓存过期时间（秒）
    ttl: 3600

# 通知配置（可选）
notifications:
  # 是否启用通知
  enabled: false
  
  # 通知方式
  methods:
    # 邮件通知
    email:
      enabled: false
      smtp_server: ""
      smtp_port: 587
      username: ""
      password: ""
      from_address: ""
      to_addresses: []
    
    # Webhook通知
    webhook:
      enabled: false
      url: ""
      headers: {}
  
  # 通知事件
  events:
    - "scan_completed"
    - "duplicate_detected"
    - "error_occurred"

# 高级配置
advanced:
  # 是否启用实验性功能
  experimental_features: false
  
  # 自定义正则表达式模式
  custom_patterns:
    # 电影文件名解析模式
    movie_patterns: []
    
    # 电视剧文件名解析模式
    tv_patterns: []
  
  # 元数据提供商优先级
  metadata_providers:
    - "tmdb"
    # 可以添加其他提供商
  
  # 文件组织规则
  organization:
    # 是否启用自动文件组织
    auto_organize: false
    
    # 电影目录模板
    movie_template: "{title} ({year})"
    
    # 电视剧目录模板
    tv_template: "{title}/Season {season:02d}"
    
    # 剧集文件模板
    episode_template: "S{season:02d}E{episode:02d} - {title}"