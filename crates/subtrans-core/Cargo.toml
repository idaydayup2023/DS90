[package]
name = "subtrans-core"
version = "3.3.1"
edition = "2024"
rust-version = "1.89"
description = "Path, classification, SRT, quality, protocol, and migration-plan rules for subtrans"
license = "MIT"
publish = false

# No reqwest, suppaftp, rusqlite, or std::process. Those belong to io and remote.

[dependencies]
anyhow = "1.0"
hex = "0.4"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
