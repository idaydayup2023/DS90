[package]
name = "subtrans-remote"
version = "3.3.1"
edition = "2024"
rust-version = "1.89"
description = "TMDB and translation-model HTTP clients for subtrans"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "query", "rustls"] }
serde_json = "1.0"
subtrans-core = { path = "../subtrans-core" }
