# aria2 配置文件
# 用于磁力链接转换的优化配置

# === 基本设置 ===
# 下载目录
dir=./aria2_downloads

# 最大同时下载数
max-concurrent-downloads=5

# 单文件最大连接数
max-connection-per-server=16

# 分片下载
split=16
min-split-size=1M

# 断点续传
continue=true

# === RPC 设置 ===
# 启用 RPC
enable-rpc=true

# RPC 端口
rpc-listen-port=6800

# 允许所有来源访问 RPC
rpc-allow-origin-all=true

# 监听所有网络接口
rpc-listen-all=true

# RPC 密钥（建议设置）
# rpc-secret=your_secret_here

# === BitTorrent 设置 ===
# 最大连接节点数
bt-max-peers=100

# 做种时间（0表示不做种）
seed-time=0

# 仅做种时分离
bt-detach-seed-only=true

# 启用 DHT
enable-dht=true

# DHT 监听端口
dht-listen-port=6881

# 启用本地节点发现
bt-enable-lpd=true

# 启用节点交换
enable-peer-exchange=true

# === 磁力链接优化 ===
# 跟踪器超时时间
bt-tracker-timeout=60

# 跟踪器连接超时
bt-tracker-connect-timeout=10

# 最大跟踪器数量
bt-max-open-files=100

# === 网络设置 ===
# 超时时间
timeout=60

# 连接超时
connect-timeout=10

# 最大重试次数
max-tries=3

# 重试等待时间
retry-wait=3

# === 日志设置 ===
# 日志级别 (debug, info, notice, warn, error)
log-level=info

# 控制台日志级别
console-log-level=notice

# === 其他设置 ===
# 检查完整性
check-integrity=true

# 文件分配方法 (none, prealloc, trunc, falloc)
file-allocation=prealloc

# 磁盘缓存
disk-cache=32M

# 用户代理
user-agent=aria2/1.36.0

# 保存会话
save-session=aria2.session
input-file=aria2.session
save-session-interval=60

# 自动保存控制文件
auto-file-renaming=false
allow-overwrite=true